
name: build

on: [push, workflow_dispatch]

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download models
        run: powershell -File get-models.ps1 -Set tessdata_best

      - name: Publish portable build
        run: dotnet publish LensLite.csproj -c Release -r win-x64 --self-contained true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: LensLite-win-x64
          path: publish
